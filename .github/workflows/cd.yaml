name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  MANIFEST: k8s/server/deployment.yaml

jobs:
  deploy:
    # Only deploy commits that passed CI.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Checked out on the branch, not the detached commit, so the manifest
      # commit at the end has somewhere to land.
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Ensure main still points at the tested commit
        run: |
          if [ "$(git rev-parse HEAD)" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "main has moved past the tested commit, a newer CD run will deploy it"
            exit 1
          fi

      # CI already built and pushed this tag; the manifest in git is the
      # ground truth for what runs in the cluster.
      - name: Pin image tag in manifest
        run: |
          IMAGE="${IMAGE_NAME}:sha-${{ github.event.workflow_run.head_sha }}"
          sed -i -E "s|image: ${IMAGE_NAME}:.*|image: ${IMAGE}|" "${MANIFEST}"
          git diff --quiet "${MANIFEST}" && echo "manifest already current" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${MANIFEST}"
          git commit -m "deploy: spotify-mcp ${{ github.event.workflow_run.head_sha }}"
          git push
